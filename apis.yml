aid: crimson-education
name: Crimson Education
description: 'Crimson Education is a multinational university admissions consultancy
  founded in Auckland, New Zealand in 2013 by Jamie Beaton, Fangzhou Jiang and Sharndre
  Kushor. It provides college-prep and admissions consulting for US, UK, EU and Australian
  universities, graduate and medical school admissions support, curriculum tutoring
  and extracurricular mentoring, and operates the Crimson Global Academy online high
  school alongside brands including MedView, Crimson MBA and Unfiltered. Its student
  and mentor experience runs on the Crimson App, whose backend REST and GraphQL surface
  is reached through a first-party TypeScript SDK published on npm as @crimson-education/sdk.'
