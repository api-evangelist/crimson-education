method: probed
source: live GET of /.well-known/* on every Crimson Education host in apis.yml
notes: >-
  No .well-known document is published on any Crimson Education host. Two probe
  hazards were ruled out and are recorded here so a later round does not re-report
  them as hits: (1) app.crimsoneducation.org is a single-page app whose catch-all
  answers HTTP 200 with the same text/html shell for every path, including
  /.well-known/agent-card.json, /llms.txt and /openapi.json — these are NOT
  documents; (2) www.crimsoneducation.org sits behind a Vercel bot checkpoint that
  answers 429 with an HTML "Vercel Security Checkpoint" interstitial for text
  resources, so its .well-known surface could not be observed rather than confirmed
  absent.
